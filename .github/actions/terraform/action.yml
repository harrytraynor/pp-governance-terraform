name: Terraform stack
description: Sign in with OIDC, init one stack, and plan, apply, or check drift.

inputs:
  stack:
    description: Directory name under stacks/
    required: true
  state_key:
    description: Blob name for this stack's state
    required: true
  command:
    description: plan, apply, or drift
    required: true
  azure_client_id:
    description: Application (client) id passed in by the workflow
    required: true
  azure_tenant_id:
    description: Entra tenant id passed in by the workflow
    required: true
  azure_subscription_id:
    description: Subscription id passed in by the workflow
    required: true
  tf_state_resource_group:
    description: State resource group passed in by the workflow
    required: true
  tf_state_storage_account:
    description: State storage account passed in by the workflow
    required: true
  tf_state_container:
    description: State container passed in by the workflow
    required: true
  plan_label:
    description: Plan file stem. Defaults to the stack name. Lanes jobs pass lanes-<cost centre> so parallel artifacts stay unique.
    required: false
    default: ""
  cost_centre:
    description: Lanes cost_centre, or empty for tenant and groups. shared checks which cost centre state blobs exist before Terraform runs.
    required: false
    default: ""

outputs:
  exit_code:
    description: Terraform exit code. Drift returns 0 when the plan exit code is 0 or 2.
    value: ${{ steps.run.outputs.exit_code }}

runs:
  using: composite
  steps:
    - name: Sign in to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.azure_client_id }}
        tenant-id: ${{ inputs.azure_tenant_id }}
        subscription-id: ${{ inputs.azure_subscription_id }}

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.16.6
        terraform_wrapper: false

    - name: Select geography
      shell: bash
      run: |
        set -euo pipefail
        location="${POWER_PLATFORM_LOCATION:-}"
        macro="${POWER_PLATFORM_MACRO_REGION:-}"
        if [ -n "${location}" ] && [ -n "${macro}" ]; then
          echo "Set only one of the GitHub variables POWER_PLATFORM_LOCATION or POWER_PLATFORM_MACRO_REGION."
          exit 1
        fi
        if [ -n "${location}" ]; then
          echo "TF_VAR_location=${location}" >> "${GITHUB_ENV}"
        fi
        if [ -n "${macro}" ]; then
          echo "TF_VAR_macro_region=${macro}" >> "${GITHUB_ENV}"
        fi

    - name: Write backend config
      shell: bash
      working-directory: stacks/${{ inputs.stack }}
      env:
        STATE_KEY: ${{ inputs.state_key }}
        TF_STATE_RESOURCE_GROUP: ${{ inputs.tf_state_resource_group }}
        TF_STATE_STORAGE_ACCOUNT: ${{ inputs.tf_state_storage_account }}
        TF_STATE_CONTAINER: ${{ inputs.tf_state_container }}
      run: |
        set -euo pipefail
        cat > backend.hcl <<EOF
        resource_group_name  = "${TF_STATE_RESOURCE_GROUP}"
        storage_account_name = "${TF_STATE_STORAGE_ACCOUNT}"
        container_name       = "${TF_STATE_CONTAINER}"
        key                  = "${STATE_KEY}"
        use_oidc             = true
        use_azuread_auth     = true
        EOF

    - name: Check the lanes state key
      if: inputs.stack == 'lanes'
      shell: bash
      env:
        STATE_KEY: ${{ inputs.state_key }}
        COST_CENTRE: ${{ inputs.cost_centre }}
        TF_STATE_STORAGE_ACCOUNT: ${{ inputs.tf_state_storage_account }}
        TF_STATE_CONTAINER: ${{ inputs.tf_state_container }}
      run: |
        set -euo pipefail
        blob_exists() {
          az storage blob exists \
            --account-name "${TF_STATE_STORAGE_ACCOUNT}" \
            --container-name "${TF_STATE_CONTAINER}" \
            --name "$1" \
            --auth-mode login \
            --only-show-errors \
            --query exists \
            -o tsv | tr -d '[:space:]'
        }
        # An empty new key would plan creates of environments that already
        # live in lanes.tfstate. Stop until the one-off state move has run.
        if [ "${STATE_KEY}" != "lanes.tfstate" ]; then
          legacy="$(blob_exists lanes.tfstate)"
          target="$(blob_exists "${STATE_KEY}")"
          if [ "${legacy}" = "true" ] && [ "${target}" != "true" ]; then
            echo "The unsplit blob lanes.tfstate still exists, and ${STATE_KEY} does not."
            echo "Run scripts/split-lanes-state.sh once, from a machine that can read and write the state container, before this job."
            echo "That script moves state only. It does not change Power Platform."
            exit 1
          fi
        fi
        if [ "${COST_CENTRE}" = "shared" ]; then
          python3 -m pip install pyyaml >/dev/null
          present=()
          while IFS= read -r slug; do
            if [ -z "${slug}" ]; then
              continue
            fi
            if [ "$(blob_exists "lanes/${slug}.tfstate")" = "true" ]; then
              present+=("\"${slug}\"")
            fi
          done < <(python3 "${GITHUB_WORKSPACE}/scripts/lane_states.py" --root "${GITHUB_WORKSPACE}" slugs)
          json="[$(IFS=,; echo "${present[*]}")]"
          echo "TF_VAR_lane_remote_state_slugs=${json}" >> "${GITHUB_ENV}"
        fi

    - name: Init
      shell: bash
      working-directory: stacks/${{ inputs.stack }}
      run: terraform init -input=false -no-color -backend-config=backend.hcl

    - name: Run Terraform
      id: run
      shell: bash
      working-directory: stacks/${{ inputs.stack }}
      run: |
        set -uo pipefail
        label="${PLAN_LABEL}"
        if [ -z "${label}" ]; then
          label="${STACK}"
        fi
        outfile="${GITHUB_WORKSPACE}/plan-${label}.txt"
        case "${COMMAND}" in
          plan)
            terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee "${outfile}"
            code=${PIPESTATUS[0]}
            ;;
          apply)
            terraform apply -input=false -no-color -lock-timeout=5m -auto-approve | tee "${outfile}"
            code=${PIPESTATUS[0]}
            ;;
          drift)
            set +e
            # -out keeps the binary plan. Exit 2 still means the plan has changes.
            terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan | tee "${outfile}"
            code=${PIPESTATUS[0]}
            set -e
            ;;
          *)
            echo "Unknown command ${COMMAND}"
            exit 1
            ;;
        esac
        echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
        # Write the exit code before show. A failed show must not look like a clean plan.
        if [ "${COMMAND}" = "drift" ] && [ "${code}" -eq 2 ]; then
          terraform show -json tfplan > "${GITHUB_WORKSPACE}/plan-${label}.json"
        fi
        if [ "${COMMAND}" = "drift" ] && { [ "${code}" -eq 0 ] || [ "${code}" -eq 2 ]; }; then
          exit 0
        fi
        exit "${code}"
      env:
        STACK: ${{ inputs.stack }}
        COMMAND: ${{ inputs.command }}
        PLAN_LABEL: ${{ inputs.plan_label }}
