# Own dev, test, and production. Allow-listed connectors only.
tier: large
description: High audience, data risk, or complexity. Dedicated release path.
firm: true
environment_group:
  rules:
    sharing_controls:
      share_mode: exclude sharing with security groups
      share_max_limit: 10
    solution_checker_enforcement:
      solution_checker_mode: block
      send_emails_enabled: true
    backup_retention:
      period_in_days: 28
    usage_insights:
      insights_enabled: true
    maker_welcome_content: null
    ai_generated_descriptions:
      ai_description_enabled: false
    ai_generative_settings:
      bing_search_enabled: false
      move_data_across_regions_enabled: false
    advanced_connector_policies_only:
      enabled: true
    # Short connector ids. The provider prepends /providers/Microsoft.PowerApps/apis/.
    advanced_connector_policies:
      allowed_connectors:
        - connector_id: shared_commondataservice
          actions_mode: all_allowed
        - connector_id: shared_approvals
          actions_mode: all_allowed
        - connector_id: shared_office365
          actions_mode: all_allowed
        - connector_id: shared_office365users
          actions_mode: all_allowed
        - connector_id: shared_sharepointonline
          actions_mode: all_allowed
        - connector_id: shared_teams
          actions_mode: all_allowed
release:
  fan_in: false
  dedicated_prod: true
dlp:
  business_connector_ids:
    - /providers/Microsoft.PowerApps/apis/shared_commondataservice
    - /providers/Microsoft.PowerApps/apis/shared_approvals
    - /providers/Microsoft.PowerApps/apis/shared_office365
    - /providers/Microsoft.PowerApps/apis/shared_office365users
    - /providers/Microsoft.PowerApps/apis/shared_sharepointonline
    - /providers/Microsoft.PowerApps/apis/shared_teams
  custom_connectors_data_group: Blocked
ungrouped_managed_environment: null
