# Locked-down learning tier. No shared test or production.
# Group-rule enums are the provider's, not the managed-environment enums.
tier: sandbox
description: Learning and experimentation. No organisational data.
firm: true
environment_group:
  rules:
    sharing_controls:
      share_mode: exclude sharing with security groups
      share_max_limit: 5
    solution_checker_enforcement:
      solution_checker_mode: block
      send_emails_enabled: true
    backup_retention:
      period_in_days: 7
    usage_insights:
      insights_enabled: true
    maker_welcome_content:
      maker_onboarding_url: https://example.com/power-platform/sandbox
      maker_onboarding_markdown: |
        ## Sandbox
        This environment is for learning. Do not put organisational data here.
    ai_generated_descriptions:
      ai_description_enabled: false
    ai_generative_settings:
      bing_search_enabled: false
      move_data_across_regions_enabled: false
    advanced_connector_policies_only: null
    advanced_connector_policies: null
release:
  fan_in: false
  dedicated_prod: false
dlp:
  # Full connector ids. Group advanced-connector rules use the short id instead.
  business_connector_ids:
    - /providers/Microsoft.PowerApps/apis/shared_commondataservice
    - /providers/Microsoft.PowerApps/apis/shared_approvals
  custom_connectors_data_group: Blocked
ungrouped_managed_environment: null
